<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>YENYANG｜營建管理平台</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="YENYANG"><meta name="theme-color" content="#F7F4EF">
<style>
:root{--bg:#F7F4EF;--ink:#1C1A17;--mut:#7A7067;--acc:#C15F3C;--line:#E3DBCF}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC",sans-serif;letter-spacing:.06em}
#app{position:fixed;inset:0;border:0;width:100%;height:100%;display:none;background:var(--bg)}
.pg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 28px env(safe-area-inset-bottom)}
.lg{width:56px;height:56px;position:relative}.lg i{position:absolute;inset:-14px;border-radius:50%;border:1px solid var(--acc);animation:r 2.4s ease-out infinite}.lg i+i{animation-delay:1.2s}
@keyframes r{0%{transform:scale(.8);opacity:.55}100%{transform:scale(1.5);opacity:0}}
h1{font-size:17px;font-weight:300;letter-spacing:.18em;margin:34px 0 8px}.m{font-size:12px;color:var(--mut);font-weight:300;text-align:center;line-height:1.9}
.btn{margin-top:34px;height:52px;width:min(320px,100%);border-radius:14px;border:1px solid #D9D0C3;background:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-size:15px;color:var(--ink);text-decoration:none;letter-spacing:.12em}
.pn{margin-top:26px;font-size:40px;font-weight:300;letter-spacing:.32em;padding-left:.32em;color:var(--ink);font-variant-numeric:tabular-nums}
.pw{margin-top:22px;width:min(320px,100%)}.pr{display:flex;gap:10px;margin-top:10px}
.pr input{flex:1;min-width:0;height:52px;border-radius:14px;border:1px solid #D9D0C3;background:#fff;font:inherit;font-size:22px;font-weight:300;letter-spacing:.3em;text-align:center;color:var(--ink);outline:none}.pr input:focus{border-color:var(--acc)}
.pr button{height:52px;padding:0 20px;border-radius:14px;border:0;background:var(--acc);color:#fff;font:inherit;font-size:15px;letter-spacing:.12em}
.pg.q{overflow:hidden}.pg.q>*{display:none}.pg.q:before{content:"";position:fixed;top:env(safe-area-inset-top);left:0;height:2px;width:40%;background:var(--acc);opacity:.7;animation:ld 1.4s ease-in-out infinite}@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.ft{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));font-size:10px;color:#A39A8F;letter-spacing:.14em}
@media (prefers-reduced-motion:reduce){.lg i,.pg.q:before{animation:none}}
</style></head><body>
<div class="pg" id="pg">
 <div class="lg"><i></i><i></i><img src="icon-192.png" alt="" width="56" height="56" style="border-radius:14px"></div>
 <h1 id="t">正在確認身分</h1><div class="m" id="m">約 1～2 秒</div>
 <a class="btn" id="b" href="#" style="display:none"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#06C755"/><path d="M12 5.5c-3.9 0-7 2.4-7 5.4 0 2.7 2.5 5 5.8 5.4l-.4 2.1c-.1.4.3.6.6.4l2.9-2.1c3-.4 5.1-2.7 5.1-5.8 0-3-3.1-5.4-7-5.4z" fill="#fff"/></svg>使用 LINE 登入</a>
 <div id="pn" class="pn" style="display:none"></div>
 <div id="pw" class="pw" style="display:none"><div class="m">LINE 驗證完成後，輸入畫面上的 6 位數字</div>
  <div class="pr"><input id="pi" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" aria-label="6 位確認碼" placeholder="------"><button id="pb" type="button">確認</button></div>
  <div class="m" id="pm" style="color:var(--acc);min-height:1.9em"></div></div>
 <div class="ft">© YENYANG　版權所有・試用版</div>
</div>
<iframe id="app" title="YENYANG 營建管理平台" allow="fullscreen"></iframe>
<script>
var GAS="https://script.google.com/macros/s/AKfycbw7Sii_8LK8Uy9GZ6Fq7M3D4FxJ6oxnGEyYfiWIulsBQTtIYpmJWmj1yUyBUYP2WJWmlg/exec";
var LINE_ID="2012266017";                   // 公開的 Channel ID（不是密鑰）
var HERE=location.origin+location.pathname.replace(/index\.html$/,""); // 這個外殼的網址＝LINE 回呼網址
var K="yySess",KS="yySt",KW="yyWait";
function get(k){try{return localStorage.getItem(k)||""}catch(e){return""}}function put(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}
function exp(t){try{var b=t.split(".")[0].replace(/-/g,"+").replace(/_/g,"/");return JSON.parse(decodeURIComponent(escape(atob(b)))).e||0}catch(e){return 0}}
function $(i){return document.getElementById(i)}
function rnd(){var a=new Uint8Array(16);crypto.getRandomValues(a);var s="";for(var i=0;i<16;i++)s+=("0"+a[i].toString(16)).slice(-2);return s}
// 這次登入的代號：只存在這個 App 裡，10 分鐘內重複使用（從 LINE 回來時畫面重開也還認得）
function sid(){var v=get(KS).split("|");if(/^[a-f0-9]{32}$/.test(v[0])&&Date.now()-(+v[1]||0)<6e5)return v[0];var s=rnd();put(KS,s+"|"+Date.now());put(KW,"");return s}
function done(t){put(KS,"");put(KW,"");put(K,t);goApp(t)}
function login(msg){$("pg").className="pg";$("t").textContent="YENYANG 營建管理平台";$("m").textContent=msg||"第一次登入由建案管理者核准・登入保留 30 天";$("pn").style.display="none";
 var s=sid();$("b").href="https://access.line.me/oauth2/v2.1/authorize?response_type=code&client_id="+LINE_ID+"&redirect_uri="+encodeURIComponent(HERE)+"&state=shell."+s+"&scope=profile%20openid";$("b").style.display="flex";
 $("pw").style.display=get(KW)===s?"block":"none"}
function goApp(t){$("pg").className="pg q";$("b").style.display="none";$("pw").style.display="none";$("pn").style.display="none";var f=$("app");f.onload=function(){f.style.display="block";$("pg").style.display="none"};f.src=GAS+"?view=portal&shell=1&tk="+encodeURIComponent(t)}
function pinGo(){var p=$("pi").value.replace(/\D/g,"");if(p.length!==6){$("pm").textContent="請輸入 6 位數字";return}
 $("pm").textContent="確認中…";fetch(GAS+"?shellp="+sid()+"&pin="+p).then(function(r){return r.json()}).then(function(r){
  if(r&&r.ok&&r.tok){done(r.tok);return}
  if(r&&r.gone){put(KS,"");put(KW,"");$("pi").value="";login("確認碼已失效，請重新按「使用 LINE 登入」。");return}
  $("pm").textContent="數字不對，還可以試 "+((r&&r.left)||0)+" 次"}).catch(function(){$("pm").textContent="網路不穩，請再試一次。"})}
$("b").addEventListener("click",function(){put(KW,sid());setTimeout(function(){$("pw").style.display="block";$("pm").textContent=""},800)});
$("pb").addEventListener("click",pinGo);$("pi").addEventListener("keydown",function(e){if(e.key==="Enter")pinGo()});
window.addEventListener("message",function(e){var h="";try{h=new URL(e.origin).hostname}catch(_){return}if(!/\.googleusercontent\.com$/.test(h))return;var d=e.data||{};
 if(d.yy==="logout"||d.yy==="relogin"){put(K,"");$("app").style.display="none";$("pg").style.display="flex";login(d.yy==="logout"?"已登出。":"登入已失效，請重新登入。")}});
(function(){var q=new URLSearchParams(location.search);
 if(q.get("code")){var code=q.get("code"),s=String(q.get("state")||"").replace(/^shell\./,""),mine=get(KS).split("|")[0];history.replaceState(null,"",HERE);
  if(!/^[a-f0-9]{32}$/.test(s)){login("登入逾時，請再按一次。");return}
  var base=GAS+"?shellx="+encodeURIComponent(code)+"&ru="+encodeURIComponent(HERE);
  if(mine&&mine===s){ // 同一個地方發起、同一個地方回來：直接登入
   fetch(base).then(function(r){return r.json()}).then(function(r){if(r&&r.ok&&r.tok)done(r.tok);else login("登入失敗，請再試一次。")}).catch(function(){login("網路不穩，請再試一次。")});return}
  // LINE 把人送到別的地方（iPhone：回到 Safari，不是主畫面的 App）：這裡只顯示確認碼，回 App 輸入才登入
  fetch(base+"&hand=1&hs="+s).then(function(r){return r.json()}).then(function(r){
   if(r&&r.ok&&r.pin){$("t").textContent="LINE 驗證完成";$("m").textContent="請回到主畫面的 YENYANG App，輸入這組數字（5 分鐘內有效）";$("pn").textContent=r.pin;$("pn").style.display="block";$("b").style.display="none";$("pw").style.display="none"}
   else{$("t").textContent="YENYANG 營建管理平台";$("m").textContent="驗證沒有完成，請回到 YENYANG App 再按一次「使用 LINE 登入」。"}}).catch(function(){$("m").textContent="網路不穩，請回到 YENYANG App 再按一次。"});return}
 if(q.get("error")){history.replaceState(null,"",HERE);login("已取消登入。");return}
 var t=get(K);if(t&&exp(t)>Date.now())goApp(t);else{put(K,"");login()}})();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script></body></html>
